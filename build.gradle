plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id "com.diffplug.spotless" version "6.25.0"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

spotless {
    java {
        target "src/**/*.java"
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Spotless formats on demand (`./gradlew spotlessApply`) rather than every compile, so student
// edits don't get silently rewritten mid-build. CI can run `spotlessCheck` to enforce style.

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                    // GC and heap tuning following the Team 254 / Mechanical
                    // Advantage (6328) recipe used in their public 2025 robot
                    // code. Pinned 100 MB heap with pre-touched pages
                    // eliminates heap-growth stalls and first-touch page
                    // faults during a match. GCTimeRatio=5 lets Serial GC
                    // (WPILib's 2024+ default) use a larger young gen,
                    // reducing minor-GC frequency. 100 MB is the
                    // community-tested safe ceiling — leaves headroom for
                    // native code, camera buffers, and the OS on both
                    // roboRIO 1 (256 MB) and roboRIO 2 (512 MB).
                    jvmArgs.add("-XX:+UnlockExperimentalVMOptions")
                    jvmArgs.add("-XX:GCTimeRatio=5")
                    jvmArgs.add("-XX:+UseSerialGC")
                    jvmArgs.add("-XX:MaxGCPauseMillis=50")
                    jvmArgs.add("-Xms100M")
                    jvmArgs.add("-Xmx100M")
                    jvmArgs.add("-XX:+AlwaysPreTouch")
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    def akitJson = new groovy.json.JsonSlurper().parseText(
        new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"

    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // dyn4j powers the chassis physics inside our trimmed simlib (frc.robot.simlib.*). It
    // ships in the roboRIO bundle (~250 KB) but the sim classes that reference it are gated
    // on Constants.getMode() == SIM in RobotContainer, so dyn4j classes never actually load
    // on the robot. If keeping dyn4j out of the roboRIO bundle becomes important, the right
    // fix is a sim-only source set; `implementation` works for both targets today.
    implementation 'org.dyn4j:dyn4j:5.0.2'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration.
// Standard:  ./gradlew simulateJava                                — GUI sim, manual DS control
// Agent:     ./gradlew simulateJavaAgent                           — no GUI, auto-starts in autonomous
//            ./gradlew simulateJavaAgent -Pmode=teleop             — no GUI, auto-starts in teleop
//            ./gradlew simulateJavaAgent -Pmode=disabled           — no GUI, stay disabled
// Manual flags (work on either task):
//   -Pheadless              : skip the sim GUI window (faster startup, no desktop required)
//   -Pmode=auto|teleop      : arm DriverStationSim into that mode at robotInit (see SimStartup.java)
def runningAgentTask = gradle.startParameter.taskNames.any {
    it == 'simulateJavaAgent' || it.endsWith(':simulateJavaAgent')
}
def isHeadless = runningAgentTask || project.hasProperty('headless')
def explicitMode = project.hasProperty('mode') ? project.property('mode').toString().toLowerCase() : ''
def simStartMode = explicitMode.isEmpty() && runningAgentTask ? 'auto' : explicitMode
def replayInputLog = project.hasProperty('replay') ? project.property('replay').toString() : ''

def isReplay = !replayInputLog.isEmpty()
if (!isReplay) {
    if (!isHeadless) {
        wpi.sim.addGui()
    }
    wpi.sim.addDriverstation().defaultEnabled = true
    wpi.sim.addWebsocketsServer()
}

// Plumb the start mode through to the JVM as a system property so SimStartup
// can read it on robotInit and arm DriverStationSim accordingly.
tasks.withType(JavaExec).configureEach { JavaExec t ->
    if (t.name == 'simulateJava' || t.name == 'simulateJavaRelease' || t.name == 'simulateJavaDebug' || t.name == 'simulateExternalJavaRelease' || t.name == 'simulateExternalJavaDebug') {
        if (isHeadless) {
            t.systemProperty 'frc.sim.headless', 'true'
        }
        if (simStartMode == 'auto' || simStartMode == 'autonomous') {
            t.systemProperty 'frc.sim.startMode', 'auto'
        } else if (simStartMode == 'teleop') {
            t.systemProperty 'frc.sim.startMode', 'teleop'
        }
        if (!replayInputLog.isEmpty()) {
            t.systemProperty 'frc.replay.input', replayInputLog
        }
    }
}

// Convenience task — headless sim that auto-enters autonomous (or whatever -Pmode says).
// Just re-targets simulateJava under the agent flag detection above.
tasks.register('simulateJavaAgent') {
    description = 'Run sim headless and auto-enable. Defaults to autonomous; override with -Pmode=teleop or -Pmode=disabled.'
    group = 'GradleRIO'
    dependsOn 'simulateJava'
}

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}
